name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nx's affected graph builds/tests ONLY what a change actually touches, keeping CI fast.
jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `nx affected` can diff against the base

      # Version comes from package.json "packageManager" — don't also set it here, or
      # pnpm/action-setup@v4 errors on the duplicate (ERR_PNPM_BAD_PNPM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD for affected on PRs and pushes.
      - uses: nrwl/nx-set-shas@v4

      - run: pnpm exec nx affected -t lint typecheck build --parallel=3
