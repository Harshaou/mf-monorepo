# TEMPLATE (non-live). The Shell deploys to Vercel via Vercel's Git integration on push;
# this workflow is the explicit-CLI alternative. Wire secrets before enabling.
name: Deploy Shell

on:
  push:
    branches: [main]
    paths:
      - 'apps/shell/**'
      - 'packages/**'

jobs:
  deploy-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx build shell

      # Requires VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets.
      - name: Deploy to Vercel
        run: |
          echo "TEMPLATE: npx vercel deploy apps/shell/dist --prod --token=$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
