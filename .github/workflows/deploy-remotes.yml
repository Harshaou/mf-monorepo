# TEMPLATE (non-live). Remotes + shared packages publish to a CDN (S3 + CloudFront).
# Because the Shell resolves remote URLs at runtime, a remote can publish to the same
# location and go live WITHOUT a Shell redeploy. Only affected remotes are built.
name: Deploy Remotes

on:
  push:
    branches: [main]
    paths:
      - 'apps/underwriting/**'
      - 'apps/product-config/**'
      - 'packages/**'

jobs:
  deploy-remotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4

      # Build only the remotes affected by this change.
      - run: pnpm exec nx affected -t build --projects=tag:type:remote

      # Publish each built remote (dist + mf-manifest.json) to the CDN.
      - name: Publish to CDN
        run: |
          echo "TEMPLATE: for each affected remote -> aws s3 sync apps/<remote>/dist s3://\$BUCKET/<remote>/"
          echo "TEMPLATE: aws cloudfront create-invalidation --distribution-id \$DIST_ID --paths '/*'"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CDN_BUCKET: ${{ secrets.CDN_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
