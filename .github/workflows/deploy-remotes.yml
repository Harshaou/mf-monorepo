# Remotes deploy to Cloudflare Pages — one Pages project per remote.
# Because the Shell resolves remote URLs at runtime, a remote can redeploy and go live
# WITHOUT a Shell redeploy (the manifest URL is stable; mf-manifest.json is served
# no-cache so clients pick up the new version on next load).
#
# Each remote is built with PUBLIC_ASSET_PREFIX = its own Pages origin, so the chunks it
# emits resolve to the CDN when the Shell (on a different origin) loads them.
#
# Both remotes deploy on every push touching apps/ or packages/, since a change in a
# shared package affects both. (For more remotes, switch to `nx affected` + a dynamic
# matrix to deploy only what changed.)
name: Deploy Remotes

on:
  push:
    branches: [main]
    paths:
      - 'apps/underwriting/**'
      - 'apps/product-config/**'
      - 'packages/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: underwriting
            project: ginja-underwriting
            origin: https://ginja-underwriting.pages.dev
          - app: product-config
            project: ginja-product-config
            origin: https://ginja-product-config.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build the remote with its production asset prefix baked in. This is what makes
      # the remote's lazy chunks load from the CDN instead of the Shell's origin.
      - name: Build ${{ matrix.app }}
        run: pnpm exec nx build ${{ matrix.app }}
        env:
          PUBLIC_ASSET_PREFIX: ${{ matrix.origin }}

      # Deploy dist/ (includes mf-manifest.json + _headers) to Cloudflare Pages.
      # --branch=main publishes to the project's production alias (matrix.origin).
      - name: Deploy ${{ matrix.app }} to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/${{ matrix.app }}/dist --project-name=${{ matrix.project }} --branch=main
